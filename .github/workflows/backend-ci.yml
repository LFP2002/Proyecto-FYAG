name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'database/**'
      - 'compose.yaml'
      - '.env.example'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'database/**'
      - 'compose.yaml'
      - '.env.example'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django / PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # Valores públicos exclusivos de CI; nunca usar en producción.
    env:
      DJANGO_SECRET_KEY: 'fyag-ci-only-django-key-not-for-production-0123456789'
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1'
      POSTGRES_DB: fyag_ci
      POSTGRES_USER: fyag_ci
      POSTGRES_PASSWORD: fyag_ci_password
      POSTGRES_HOST: '127.0.0.1'
      POSTGRES_PORT: '5432'
      JWT_SIGNING_KEY: 'fyag-ci-only-jwt-signing-key-independent-9876543210'

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fyag_ci
          POSTGRES_USER: fyag_ci
          POSTGRES_PASSWORD: fyag_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fyag_ci -d fyag_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.18'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-test.txt

      - name: Comprobar Django
        working-directory: backend
        run: python manage.py check

      - name: Verificar migraciones pendientes
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Iniciar Mongo QA autenticado y bootstrap idempotente
        env:
          FYAG_MONGO_DB: fyag_documentos_test
          FYAG_MONGO_USER: fyag_ci_app
          FYAG_MONGO_TEST_USER: fyag_ci_app
          FYAG_MONGO_TEST_ROOT_USER: fyag_ci_bootstrap
        run: |
          # Secretos efímeros generados por run; no valores reales en Git.
          ROOT_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(36))')
          APP_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(36))')
          echo "::add-mask::$ROOT_PASSWORD"
          echo "::add-mask::$APP_PASSWORD"
          echo "FYAG_MONGO_TEST_ROOT_PASSWORD=$ROOT_PASSWORD" >> "$GITHUB_ENV"
          echo "FYAG_MONGO_TEST_PASSWORD=$APP_PASSWORD" >> "$GITHUB_ENV"
          echo "FYAG_MONGO_TEST_ROOT_USER=$FYAG_MONGO_TEST_ROOT_USER" >> "$GITHUB_ENV"
          echo "FYAG_MONGO_TEST_USER=$FYAG_MONGO_TEST_USER" >> "$GITHUB_ENV"
          echo "FYAG_MONGO_TEST_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "FYAG_MONGO_TEST_PORT=27017" >> "$GITHUB_ENV"
          export MONGO_INITDB_ROOT_USERNAME="$FYAG_MONGO_TEST_ROOT_USER"
          export MONGO_INITDB_ROOT_PASSWORD="$ROOT_PASSWORD"
          export FYAG_MONGO_PASSWORD="$APP_PASSWORD"
          docker run -d --name fyag_mongo_ci --tmpfs /data/db --tmpfs /data/configdb \
            -p 127.0.0.1:27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME -e MONGO_INITDB_ROOT_PASSWORD \
            -e FYAG_MONGO_DB -e FYAG_MONGO_USER -e FYAG_MONGO_PASSWORD \
            -v "$PWD/database:/opt/fyag/database:ro" \
            -v "$PWD/backend/apps/documentos/esquema.json:/opt/fyag/esquema.json:ro" \
            -v "$PWD/database/usuarios_mongodb.js:/docker-entrypoint-initdb.d/10-fyag.js:ro" mongo:8.0
          for i in $(seq 1 60); do
            if docker exec fyag_mongo_ci mongosh --quiet /opt/fyag/database/health_mongodb.js; then break; fi
            sleep 2
          done
          docker exec fyag_mongo_ci mongosh --quiet /opt/fyag/database/health_mongodb.js
          docker exec fyag_mongo_ci mongosh --quiet /opt/fyag/database/usuarios_mongodb.js
          docker exec fyag_mongo_ci mongosh --quiet /opt/fyag/database/usuarios_mongodb.js

      - name: Aplicar migraciones sobre PostgreSQL limpio
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Ejecutar suite completa
        working-directory: backend
        run: python manage.py test

      - name: Cerrar Mongo QA efímero
        if: always()
        run: docker rm -f fyag_mongo_ci || true
